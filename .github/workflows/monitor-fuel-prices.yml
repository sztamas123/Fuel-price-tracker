name: Monitor fuel prices

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuel-price-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Fetch, analyze, and notify
        run: npm start
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRICE_DROP_VS_7D: ${{ vars.PRICE_DROP_VS_7D || '0.20' }}
          PRICE_DROP_VS_PREVIOUS: ${{ vars.PRICE_DROP_VS_PREVIOUS || '0.15' }}
          ABSOLUTE_TARGET_PRICE: ${{ vars.ABSOLUTE_TARGET_PRICE }}
          NOTIFICATION_COOLDOWN_HOURS: ${{ vars.NOTIFICATION_COOLDOWN_HOURS || '24' }}
          ADDITIONAL_DROP_FOR_RENOTIFY: ${{ vars.ADDITIONAL_DROP_FOR_RENOTIFY || '0.05' }}
          FUEL_PRICE_PROVIDER: http
          FUEL_PRICE_API_URL: https://pretcarburant.ro/api/v1/preturi
          TRACKED_CITY_SLUGS: ${{ vars.TRACKED_CITY_SLUGS || 'targu-mures' }}
